name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --no-daemon
      - name: Dependency list for Trivy is up to date
        run: |
          bash ./gradlew -I gradle/dependency-lock.init.gradle :app:dependencies --write-locks --no-daemon
          git diff --exit-code app/gradle.lockfile
